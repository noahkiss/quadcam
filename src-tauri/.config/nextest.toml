# cargo-nextest runs every test in its own process, many at once. The tests that share
# something machine-wide run one at a time, in the `serial` group; the few that time a
# real-time thread run alone. See docs/development.md.
#
#   cargo nextest run              # everything (the `default` profile)
#   cargo nextest run -P quick     # skips the slow disk-image tests and tests/it/join.rs
#   cargo nextest run -P ci        # what CI runs: everything, JUnit, two known flakes retried
#   cargo nextest run -P ci-quick  # CI on a branch whose change misses the slow tests' code
#
# Doc tests are not nextest's: `cargo test --doc` runs them (the crates have none today).

[test-groups]
# hdiutil and diskutil go through one system daemon, and a detached image's disk number is
# reused by the next attach: the disk-image tests attach, unmount and erase one at a time.
serial = { max-threads = 1 }

[profile.default]
slow-timeout = { period = "60s" }

# Every test that attaches a disk image (tests/it/common/mod.rs `Image`). The integration
# tests are one binary, `it`; a test's name starts with its module (`disk_image::detection`).
[[profile.default.overrides]]
filter = '''
binary_id(quadcam::it) & (
    test(/^disk_image::/)
  | test(/^card_prep::/)
  | test(/^mount_cycle::/)
  | test(=cli::format_a_disk_image_only_with_every_flag)
  | test(=mcp::format_through_mcp_needs_the_gui_click)
)
'''
test-group = 'serial'
# One at a time they take about 150 s: start them first, beside everything else.
priority = 100

# Tests that time the sim's real-time thread against the wall clock (2 kHz steps, the
# stall drop, the p99 step cost) run alone: on a loaded runner the thread oversleeps.
[[profile.default.overrides]]
filter = '''
    (binary_id(quadcam-sim::it) & test(=runner::a_forced_stall_drops_sim_time_and_logs_it))
  | binary_id(quadcam-sim::bench)
  | (binary_id(quadcam::it) & test(=sim_host::start_describes_the_room_and_frames_advance))
'''
threads-required = 'num-test-threads'

# The fast local loop: everything but the disk images and the split-recording joins (ffmpeg,
# about 95 s of test time). default-filter cannot name a group: keep the disk-image lines in
# step with the `serial` filter above.
[profile.quick]
default-filter = '''
not (binary_id(quadcam::it) & (
    test(/^disk_image::/)
  | test(/^card_prep::/)
  | test(/^mount_cycle::/)
  | test(=cli::format_a_disk_image_only_with_every_flag)
  | test(=mcp::format_through_mcp_needs_the_gui_click)
  | test(/^join::/)
))
'''

[profile.ci]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 10 }
failure-output = "immediate-final"

[profile.ci.junit]
path = "junit.xml"

# Known load flakes, retried once: the joined output's frame-count verify (tests/it/join.rs)
# and diskutil mounting and unmounting the image (tests/it/mount_cycle.rs). Nothing else retries.
[[profile.ci.overrides]]
filter = 'binary_id(quadcam::it) & (test(/^join::/) | test(/^mount_cycle::/))'
retries = 1

# CI on a branch push or pull request whose change touches nothing the disk-image tests and
# tests/it/join.rs cover (the path filter in .github/workflows/ci.yml): `quick`'s filter with
# `ci`'s settings. main and tags always run `ci`.
[profile.ci-quick]
inherits = "quick"
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 10 }
failure-output = "immediate-final"

[profile.ci-quick.junit]
path = "junit.xml"
