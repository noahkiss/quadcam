[package]
name = "quadcam"
version = "0.21.6"
description = "Import analog FPV DVR clips: date, name, convert, verify, then format the card"
edition = "2021"
license = "MIT"
repository = "https://github.com/noahkiss/quadcam"
rust-version = "1.89"
publish = false
default-run = "quadcam"
# The integration tests are one binary (tests/it), not one per file: each binary links the
# whole crate. The [[test]] list below names them all.
autotests = false

[workspace]
members = ["sim"]
# Plain `cargo test` and `cargo clippy` in src-tauri cover the sim crate too.
default-members = [".", "sim"]

# The sim's physics tests and bench fly minutes of 2 kHz steps: optimise the sim and its
# physics dependencies even in dev builds, so tests stay fast without a release build.
[profile.dev.package.quadcam-sim]
opt-level = 3

[profile.dev.package.rapier3d-f64]
opt-level = 3

[profile.dev.package.parry3d-f64]
opt-level = 3

[profile.dev.package.glamx]
opt-level = 3

[profile.dev.package.glam]
opt-level = 3

[lib]
name = "quadcam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8.0"
tauri-plugin-opener = "2.7.0"
tauri-plugin-updater = "2.13.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1.10"
notify = "8.2"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
specta = { version = "=2.0.0-rc.25", features = ["derive", "chrono", "serde_json"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "=0.0.12"
schemars = "1"
siphasher = "1"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
serialport = { version = "4.10.1", default-features = false }
sha2 = "0.10"
toml = "1"
quadcam-sim = { path = "sim" }
png = "0.18.1"
nusb = "0.2.7"
libc = "0.2"
semver = "1"

[dev-dependencies]
tempfile = "3"
insta = { version = "1", features = ["json", "redactions"] }

[[test]]
name = "it"
path = "tests/it/main.rs"

# These change an environment variable that code under test in other modules reads. In
# one process under `cargo test` that would leak into tests running beside them, so each
# stays a binary of its own. nextest runs every test in its own process either way.
[[test]]
name = "output_dir" # $HOME
path = "tests/output_dir.rs"

[[test]]
name = "rates" # QUADCAM_SIMS_HOME, which gear status reads
path = "tests/rates.rs"

[[test]]
name = "real_paths" # $HOME, set to the account's own
path = "tests/real_paths.rs"

[[test]]
name = "map_callout" # AppKit on the main thread: no test harness
path = "tests/map_callout.rs"
harness = false

[[test]]
name = "voice_core" # QUADCAM_TTS_KEY and QUADCAM_OPENAI_KEY, which the voice studio reads
path = "tests/voice_core.rs"

[target.'cfg(target_os = "macos")'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["macos-shared-device"] }
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSURL", "NSString", "NSArray", "NSError", "NSFileManager", "NSGeometry", "NSThread", "NSRunLoop", "NSDate", "NSBundle", "NSValue", "block2"] }
objc2-map-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-location", "MKAnnotation", "MKLocalSearch", "MKLocalSearchRequest", "MKLocalSearchResponse", "MKMapItem", "MKPlacemark", "objc2-app-kit", "MKMapView", "MKPointAnnotation", "MKShape", "MKTypes", "MKGeometry", "MKAnnotationView", "MKMarkerAnnotationView", "MKClusterAnnotation", "MKMapConfiguration", "MKStandardMapConfiguration", "MKImageryMapConfiguration", "MKHybridMapConfiguration"] }
objc2-core-location = { version = "0.3", default-features = false, features = ["std", "block2", "CLLocation", "CLPlacemark", "CLGeocoder", "CLLocationManager", "CLLocationManagerDelegate"] }
objc2-photos = "0.3"
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSSharingService", "NSResponder", "NSView", "NSGlassEffectView", "NSGraphics", "NSColor", "NSControl", "NSButton", "NSButtonCell", "NSCell", "NSTextField", "NSStackView", "NSImageView", "NSImage", "NSEvent", "NSWindow", "NSAccessibilityProtocols", "NSUserInterfaceLayout", "NSLayoutConstraint", "NSLayoutAnchor"] }
security-framework = "3.5"
