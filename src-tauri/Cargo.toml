[package]
name = "quadcam"
version = "0.2.0"
description = "Import analog FPV DVR clips: date, name, convert, verify, then format the card"
edition = "2021"
license = "MIT"
repository = "https://github.com/noahkiss/quadcam"
rust-version = "1.85"
publish = false
default-run = "quadcam"

[lib]
name = "quadcam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["protocol-asset"] }
tauri-plugin-store = "2.5.0"
tauri-plugin-dialog = "2.8.0"
tauri-plugin-opener = "2.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1.10"
notify = "8.2"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSURL", "NSString", "NSArray", "NSError", "block2"] }
objc2-photos = "0.3"
