[package]
name = "quadcam"
version = "0.6.4"
description = "Import analog FPV DVR clips: date, name, convert, verify, then format the card"
edition = "2021"
license = "MIT"
repository = "https://github.com/noahkiss/quadcam"
rust-version = "1.89"
publish = false
default-run = "quadcam"

[lib]
name = "quadcam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8.0"
tauri-plugin-opener = "2.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1.10"
notify = "8.2"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
specta = { version = "=2.0.0-rc.25", features = ["derive", "chrono", "serde_json"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "=0.0.12"
schemars = "1"
siphasher = "1"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
serialport = { version = "4.10.1", default-features = false }

[dev-dependencies]
tempfile = "3"
insta = { version = "1", features = ["json", "redactions"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSURL", "NSString", "NSArray", "NSError", "NSFileManager", "NSGeometry", "NSThread", "NSRunLoop", "NSDate", "block2"] }
objc2-map-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-location", "MKAnnotation", "MKLocalSearch", "MKLocalSearchRequest", "MKLocalSearchResponse", "MKMapItem", "MKPlacemark"] }
objc2-core-location = { version = "0.3", default-features = false, features = ["std", "CLLocation", "CLPlacemark"] }
objc2-photos = "0.3"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSSharingService", "NSResponder", "NSView"] }
