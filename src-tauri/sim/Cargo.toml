[package]
name = "quadcam-sim"
version = "0.1.0"
description = "QuadCam's FPV simulator core: physics, flight controller, profiles"
edition = "2021"
license = "MIT"
repository = "https://github.com/noahkiss/quadcam"
rust-version = "1.89"
publish = false

[dependencies]
rapier3d-f64 = { version = "0.36", features = ["enhanced-determinism"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rtrb = "0.4"
triple_buffer = "9"
