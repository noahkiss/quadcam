name: Release

# A pushed `v*` tag runs the shared Tauri macOS release
# (noahkiss/workflows, tauri-macos-release.yml). It builds QuadCam.app on an
# Apple Silicon runner, signs it with the Developer ID of NKMK Digital Co.,
# notarizes and staples it, waits for a green ci.yml run on the tagged commit,
# attaches quadcam-X.Y.Z-arm64.zip to the tag's GitHub Release, then bumps the
# Homebrew cask (`noahkiss/tap/quadcam`) through the tap's own `bump.yml`.
#
# To cut a release:
#
#   1. Set the same version in src-tauri/Cargo.toml and src-tauri/tauri.conf.json.
#   2. Commit, then `git tag vX.Y.Z && git push origin main vX.Y.Z`.
#
# To re-run the pipeline for a tag that already exists, dispatch it on the tag
# (the `release` environment admits only `v*` tags):
#
#   gh workflow run release.yml -R noahkiss/quadcam --ref vX.Y.Z -f tag=vX.Y.Z
#
# A re-run never replaces a zip that is already attached: the cask's sha256
# pins what was published, and a rebuilt zip is not byte-identical.
#
# Secrets: the signing certificate and the App Store Connect API key live in
# the `release` environment (MAC_CERT_P12, MAC_CERT_PASSWORD, ASC_KEY_P8,
# ASC_KEY_ID, ASC_ISSUER_ID), which only `v*` tags can use. The tap hop needs
# HOMEBREW_TAP_TOKEN, a PAT with `workflow` scope on the tap: this repo's
# GITHUB_TOKEN cannot dispatch another repository.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release, e.g. v0.2.0'
        required: true

permissions:
  contents: write
  actions: read # read the CI run on the tagged commit

jobs:
  release:
    uses: noahkiss/workflows/.github/workflows/tauri-macos-release.yml@main
    permissions:
      contents: write
      actions: read
    with:
      tag: ${{ inputs.tag }}
      app-name: QuadCam
      asset-prefix: quadcam
      brew-packages: ffmpeg
      smoke-command: '"$APP/Contents/MacOS/quadcam-cli" --version'
      entitlements: src-tauri/Entitlements.plist
      signing-identity: 'Developer ID Application: NKMK Digital Co. (2Z88BYP37C)'
      team-id: 2Z88BYP37C
      environment: release
      require-ci-workflow: ci.yml
      tap-repo: noahkiss/homebrew-tap
      tap-formula: quadcam
    secrets:
      tap_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
