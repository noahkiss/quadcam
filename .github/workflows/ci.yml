name: CI

# Format, clippy, tests and a release build of the app on every push to main
# and every pull request. The app is macOS-only, so this runs on an Apple
# Silicon runner. The repository is public, so macOS minutes are free.
#
# The tests need ffmpeg, which comes from Homebrew. The format tests attach
# small FAT32 disk images with hdiutil and erase only those images. No test
# reaches a Photos library: processes started by cargo use the dry-run
# recorder unless QUADCAM_PHOTOS=real.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust and ffmpeg
        run: |
          rustup toolchain install stable --profile minimal -c clippy,rustfmt
          rustup default stable
          brew install ffmpeg

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked -- --nocapture --test-threads=1
      - run: cargo build --release --locked --bins

  # The React UI in app/: typecheck, lint, unit tests, build, and the Playwright specs
  # on the mocked IPC. Node comes from .node-version, pnpm
  # from packageManager in app/package.json. The license check and the notices that
  # `pnpm build` writes read `cargo metadata`, so this job needs Rust too.
  ui:
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install Rust (for cargo metadata)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - run: pnpm install --frozen-lockfile
      - name: License check (fails on a license outside the allow list)
        run: node ../scripts/notices.mjs --check
      - run: node --test ../scripts/notices.test.mjs
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm exec playwright install webkit
      - run: pnpm e2e
      - run: pnpm build
      - run: test -s dist/THIRD_PARTY_NOTICES.txt
