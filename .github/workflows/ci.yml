name: CI

# Format, clippy, tests and a release build of the app on every push to any branch or
# `v*` tag, and on every pull request from a fork. The app is macOS-only, so the Rust job
# runs on an Apple Silicon runner. The repository is public, so macOS minutes are free.
# The UI jobs need no macOS (the Playwright specs run on the mocked core), so they run on
# Linux, where runners start at once.
#
# A push of main or a tag skips the tests when a release branch (`rel-*`) already ran them
# green on the same commit (job `proven`). A rel-* run is as full as a main run: every
# Rust test and axe in both themes.
#
# The runner is GitHub's `xcode-27` image (public preview: macOS 27, arm64, Xcode 27). The
# Swift helper `quadcam-intel` (intel/) needs the macOS 26 SDK or newer; build.rs builds it
# with the image's Xcode. Move back to a `macos-NN` label once a GA image ships Xcode 27.
#
# The tests need ffmpeg, which comes from Homebrew. They run under cargo-nextest
# (src-tauri/.config/nextest.toml, profile `ci`, or `ci-quick` on a branch whose change
# misses the slow tests' code): in parallel, except the disk-image tests, which attach small
# FAT32 disk images with hdiutil, one at a time, and erase only those images. No test reaches a Photos library: processes started by cargo use the dry-run
# recorder unless QUADCAM_PHOTOS=real.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a branch or pull request cancels its older run. A run on main or on a tag
# gets a group of its own and is never cancelled or replaced: the Release workflow waits
# for a green run on the tagged commit.
concurrency:
  group: >-
    ci-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # The release steps (AGENTS.md "Release") push main and the tag on the commit that a
  # rel-* branch's run proved. That run counts for both, so their runs skip the other jobs
  # instead of running the same suite again; Release accepts any green run on the commit.
  # Any other push of main, such as a merge, finds no such run and runs everything.
  proven:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      by: ${{ steps.find.outputs.by }}
    steps:
      - name: Find a green rel-* run on this commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          url="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success&event=push&per_page=100" \
            --jq '[.workflow_runs[] | select(.head_branch | startswith("rel-"))][0].html_url // empty')" || url=""
          if [ -n "$url" ]; then
            echo "::notice::$url already passed on this commit; skipping the tests"
          else
            echo "No green rel-* run on $GITHUB_SHA; running the tests"
          fi
          echo "by=$url" >> "$GITHUB_OUTPUT"

  # A Renovate branch (`renovate/*`) that changes only the UI's dependencies (files under
  # app/, .node-version) runs the Linux jobs and skips the macOS one. Any other change on
  # it, such as Cargo.lock or an action in this file, runs everything.
  renovate:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/renovate/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Does the change reach past app/
        id: diff
        run: |
          set -euo pipefail
          other="$(git diff --name-only origin/main...HEAD | grep -vE '^(app/|\.node-version$)' || true)"
          if [ -n "$other" ]; then
            printf 'Outside app/:\n%s\n' "$other"
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::only app/ changed; skipping the macOS job"
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: [proven, renovate]
    # A pull request from this repository's own branches already ran on its push.
    if: >-
      !cancelled() && needs.proven.outputs.by == '' && needs.renovate.outputs.rust != 'false' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      # build.rs fails instead of bundling a stand-in when the Swift helper does not build.
      QUADCAM_INTEL_REQUIRED: '1'
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml at the repo root names the version and components.
      - name: Install Rust and ffmpeg
        run: |
          rustup toolchain install
          rustc --version
          xcodebuild -version
          swift --version
          brew install ffmpeg

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest@0.9.146

      # The slow tests (the `serial` disk-image group and tests/it/join.rs) run on a branch or a
      # pull request only when the change since its merge base with main touches the code they
      # cover; otherwise the profile `ci-quick` skips them. main, rel-* and tags always run them all.
      - name: Changes the slow tests cover
        id: slow
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/heads/rel-')
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: main
          filters: |
            slow:
              - 'src-tauri/src/core/import.rs'
              - 'src-tauri/src/core/prep.rs'
              - 'src-tauri/src/core/*card*.rs'
              - 'src-tauri/src/disk.rs'
              - 'src-tauri/src/join.rs'
              - 'src-tauri/src/media.rs'
              - 'src-tauri/src/scan.rs'
              - 'src-tauri/src/session.rs'
              - 'src-tauri/src/pipeline/**'
              - 'src-tauri/src/sources/**'
              - 'src-tauri/src/gear/events.rs'
              - 'src-tauri/src/gear/detect.rs'
              - 'src-tauri/src/bin/quadcam-cli/main.rs'
              - 'src-tauri/src/mcp/mod.rs'
              - 'src-tauri/src/mcp/server.rs'
              - 'src-tauri/src/mcp/params.rs'
              - 'src-tauri/src/mcp/tools.rs'
              - 'src-tauri/src/mcp/render.rs'
              - 'src-tauri/tests/it/common/**'
              - 'src-tauri/tests/it/disk_image.rs'
              - 'src-tauri/tests/it/card_prep.rs'
              - 'src-tauri/tests/it/mount_cycle.rs'
              - 'src-tauri/tests/it/cli.rs'
              - 'src-tauri/tests/it/mcp.rs'
              - 'src-tauri/tests/it/join.rs'
              - 'src-tauri/Cargo.toml'
              - 'src-tauri/Cargo.lock'
              - 'src-tauri/.config/nextest.toml'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'

      - name: Pick the test profile
        id: profile
        env:
          SKIPPED: ${{ steps.slow.outcome == 'skipped' }}
          SLOW: ${{ steps.slow.outputs.slow }}
        run: |
          if [ "$SKIPPED" = true ] || [ "$SLOW" = true ]; then p=ci; else p=ci-quick; fi
          echo "Test profile: $p"
          echo "name=$p" >> "$GITHUB_OUTPUT"

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo nextest run --workspace --locked --profile ${{ steps.profile.outputs.name }}

      - name: Upload the test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit
          path: src-tauri/target/nextest/${{ steps.profile.outputs.name }}/junit.xml
          if-no-files-found: ignore

      - run: cargo build --release --locked --bins

  # The React UI in app/: typecheck, lint, unit tests and build. Node comes from
  # .node-version, pnpm from packageManager in app/package.json. The license check and the
  # notices that `pnpm build` writes read `cargo metadata`, so this job needs Rust too.
  ui:
    needs: proven
    if: >-
      !cancelled() && needs.proven.outputs.by == '' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install Rust (for cargo metadata)
        run: |
          rustup toolchain install
          rustc --version

      - run: pnpm install --frozen-lockfile
      - name: License check (fails on a license outside the allow list)
        run: node ../scripts/notices.mjs --check
      - run: node --test ../scripts/notices.test.mjs
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: test -s dist/THIRD_PARTY_NOTICES.txt

  # The Playwright specs on the mocked IPC, in headless WebKit, split across four runners
  # (`--shard`). They need no macOS: the core is the mock, and no spec compares pixels.
  # The job runs in Playwright's own image, which carries WebKit and its system packages,
  # so no step reaches an Ubuntu apt mirror (one hung the install for up to 15 minutes about
  # half the time). The image tag matches @playwright/test in app/package.json; renovate.json
  # bumps both in one pull request.
  e2e:
    name: e2e (${{ matrix.shard }}/4)
    needs: proven
    if: >-
      !cancelled() && needs.proven.outputs.by == '' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      # A no-op when the image's WebKit is the one @playwright/test wants. It downloads the
      # browser only if the two versions ever drift apart.
      - name: Check WebKit
        run: timeout -k 10 180 pnpm exec playwright install webkit
      # The axe specs run in the dark theme only on a branch or pull request, and in both on
      # main, rel-* and tags (e2e/fixtures.ts `axeSchemes`). Every other spec runs every time.
      - run: pnpm e2e --shard=${{ matrix.shard }}/4
        env:
          QC_AXE_THEMES: >-
            ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
            || startsWith(github.ref, 'refs/heads/rel-')) && 'dark,light' || 'dark' }}
